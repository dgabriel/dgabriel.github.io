<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to PDF Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css?v=3">
    <script>if(localStorage.getItem('dg-invert')==='1')document.documentElement.classList.add('inverted');</script>
    <style>
        #dropZone {
            border: 2px dashed #888;
            padding: 2rem;
            text-align: center;
            margin: 1rem 0;
            cursor: pointer;
        }
        #dropZone.dragover { background: rgba(128,128,128,0.15); }
        #fileList { list-style: none; padding: 0; }
        #fileList li {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.4rem 0; border-bottom: 1px solid rgba(128,128,128,0.3);
        }
        #fileList img { width: 48px; height: 48px; object-fit: cover; }
        #fileList .name { flex: 1; word-break: break-all; }
        #fileList button { background: none; border: none; cursor: pointer; font-size: 1.1rem; }
        #status { margin: 1rem 0; }
        .advanced { margin: 1rem 0; }
        .advanced summary { cursor: pointer; user-select: none; font-weight: bold; }
        .advanced[open] summary { margin-bottom: 0.75rem; }
        .advanced .field { margin: 0.5rem 0; }
        .advanced label { display: inline-block; }
        .advanced input[type="range"] { vertical-align: middle; }
        .advanced .row label { min-width: 12rem; }
    </style>
</head>
<body>
<div class="ticker" data-pattern="*~*~*~*~*~*~*~*~*~*~"></div>
<nav class="site-nav"><a href="index.html">:: DAWN GABRIEL ::</a></nav>
<a class="back-link" href="index.html">&lt;&lt; BACK</a>

<h1>Image to PDF Converter</h1>
<p class="subtitle" data-typewriter="FREE. NO ACCOUNT REQUIRED.">FREE. NO ACCOUNT REQUIRED.</p>

<div class="panel">
    <div id="dropZone">
        <p>Drag &amp; drop images here, or click to select</p>
        <input type="file" id="imageInput" accept="image/jpeg,image/png,image/gif,image/webp,image/bmp,image/tiff,image/heic,image/heif" multiple hidden />
        <p class="note">Supports JPG, PNG, GIF, WebP, BMP, TIFF, and HEIC/HEIF. Each image becomes one page.</p>
    </div>

    <ul id="fileList"></ul>

    <details class="advanced">
      <summary>Advanced</summary>
      <div class="field row">
        <label for="maxDim">Max dimension (px):</label>
        <input type="number" id="maxDim" value="1600" min="200" step="100">
        <span class="note">Downscales large images to keep the PDF small. 0 = no downscale.</span>
      </div>
      <div class="field row">
        <label for="quality">JPEG quality: <span id="qualityVal">70</span>%</label>
        <input type="range" id="quality" min="10" max="100" value="70">
      </div>
      <div class="field">
        <label><input type="checkbox" id="keepOriginal"> Keep JPEG/PNG originals (lossless, larger)</label>
      </div>
    </details>

    <button id="convertBtn" disabled>Convert to PDF</button>
    <p id="status"></p>
</div>

<div class="ticker" data-pattern="*~*~*~*~*~*~*~*~*~*~"></div>

<script src="script.js?v=3"></script>
<script>
    window.jsPDF = window.jspdf.jsPDF;

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('imageInput');
    const fileListEl = document.getElementById('fileList');
    const convertBtn = document.getElementById('convertBtn');
    const statusEl = document.getElementById('status');
    const maxDimEl = document.getElementById('maxDim');
    const qualityEl = document.getElementById('quality');
    const qualityValEl = document.getElementById('qualityVal');
    const keepOriginalEl = document.getElementById('keepOriginal');

    qualityEl.addEventListener('input', () => { qualityValEl.textContent = qualityEl.value; });

    let files = [];

    const HEIC_TYPES = ['image/heic', 'image/heif', 'image/heic-sequence', 'image/heif-sequence'];

    function isHeic(file) {
        return HEIC_TYPES.includes(file.type) || /\.(heic|heif)$/i.test(file.name);
    }

    function render() {
        fileListEl.innerHTML = '';
        files.forEach((file, i) => {
            const li = document.createElement('li');

            const thumb = document.createElement('img');
            thumb.alt = '';
            const url = URL.createObjectURL(file);
            thumb.src = url;
            thumb.onload = () => URL.revokeObjectURL(url);

            const name = document.createElement('span');
            name.className = 'name';
            name.textContent = file.name;

            const remove = document.createElement('button');
            remove.textContent = '✕';
            remove.title = 'Remove';
            remove.addEventListener('click', () => {
                files.splice(i, 1);
                render();
            });

            li.append(thumb, name, remove);
            fileListEl.appendChild(li);
        });
        convertBtn.disabled = files.length === 0;
    }

    function addFiles(list) {
        for (const f of list) {
            if (f.type.startsWith('image/') || isHeic(f)) {
                files.push(f);
            }
        }
        render();
    }

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
        addFiles(fileInput.files);
        fileInput.value = '';
    });

    ['dragenter', 'dragover'].forEach(ev =>
        dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('dragover'); })
    );
    ['dragleave', 'drop'].forEach(ev =>
        dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('dragover'); })
    );
    dropZone.addEventListener('drop', e => addFiles(e.dataTransfer.files));

    // Load an image element from a file, converting HEIC to a usable blob first.
    function loadImage(file) {
        return (isHeic(file)
            ? heic2any({ blob: file, toType: 'image/png' })
                .then(blob => blob instanceof Blob ? blob : blob[0])
            : Promise.resolve(file)
        ).then(blob => new Promise((resolve, reject) => {
            const img = new Image();
            const url = URL.createObjectURL(blob);
            img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not load ' + file.name)); };
            img.src = url;
        }));
    }

    // Render an image element to a canvas, optionally downscaling to maxDim,
    // and export as a JPEG data URL at the given quality (0..1).
    function toJpegDataUrl(img, maxDim, quality) {
        let w = img.naturalWidth, h = img.naturalHeight;
        if (maxDim > 0 && (w > maxDim || h > maxDim)) {
            const scale = maxDim / Math.max(w, h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        return canvas.toDataURL('image/jpeg', quality);
    }

    // Read a File as a data URL (used to embed JPEG/PNG originals untouched).
    function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
            const r = new FileReader();
            r.onload = () => resolve(r.result);
            r.onerror = () => reject(new Error('Could not read ' + file.name));
            r.readAsDataURL(file);
        });
    }

    function originalFormat(file) {
        if (file.type === 'image/png' || /\.png$/i.test(file.name)) return 'PNG';
        if (file.type === 'image/jpeg' || /\.(jpe?g)$/i.test(file.name)) return 'JPEG';
        return null; // not a natively-embeddable original
    }

    convertBtn.addEventListener('click', async () => {
        if (files.length === 0) return;
        convertBtn.disabled = true;
        statusEl.textContent = 'Converting\u2026';

        const maxDim = parseInt(maxDimEl.value, 10) || 0;
        const quality = (parseInt(qualityEl.value, 10) || 70) / 100;
        const keepOriginal = keepOriginalEl.checked;

        const pdf = new jsPDF();
        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();

        try {
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                statusEl.textContent = `Converting\u2026 (${i + 1}/${files.length})`;
                const img = await loadImage(file);

                let dataUrl, format;
                const origFmt = originalFormat(file);
                if (keepOriginal && origFmt && !isHeic(file)) {
                    dataUrl = await readFileAsDataUrl(file);
                    format = origFmt;
                } else {
                    dataUrl = toJpegDataUrl(img, maxDim, quality);
                    format = 'JPEG';
                }

                const aspect = img.naturalWidth / img.naturalHeight;
                let w = pageW, h = pageW / aspect;
                if (h > pageH) { h = pageH; w = pageH * aspect; }
                const x = (pageW - w) / 2, y = (pageH - h) / 2;
                if (i > 0) pdf.addPage();
                pdf.addImage(dataUrl, format, x, y, w, h);
            }
            pdf.save('converted.pdf');
            statusEl.textContent = 'Done.';
        } catch (err) {
            statusEl.textContent = 'Error: ' + err.message;
        } finally {
            convertBtn.disabled = false;
        }
    });
</script>
</body>
</html>
