<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to PDF Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
    <a class="home-link" href="index.html">Dawn Gabriel</a>
</header>
<a class="back-link" href="index.html">&larr; Back</a>
<h1>Image to PDF Converter</h1>
<p class="subtitle">Free, no account required.</p>

<div class="panel">
    <label for="imageInput">Upload an image</label>
    <input type="file" id="imageInput" accept="image/jpeg, image/png, image/gif" />
    <button id="convertBtn">Convert to PDF</button>
</div>

<script>
    window.jsPDF = window.jspdf.jsPDF;

    document.getElementById('convertBtn').addEventListener('click', function() {
        const fileInput = document.getElementById('imageInput');
        if (fileInput.files.length === 0) {
            alert('Please select an image file.');
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = function(event) {
            const img = new Image();
            img.src = event.target.result;

            img.onload = function() {
                const pdf = new jsPDF();
                const width = pdf.internal.pageSize.getWidth();
                const height = pdf.internal.pageSize.getHeight();

                const aspectRatio = img.width / img.height;
                let imgWidth = width;
                let imgHeight = width / aspectRatio;

                if (imgHeight > height) {
                    imgHeight = height;
                    imgWidth = height * aspectRatio;
                }

                pdf.addImage(img, 'JPEG', (width - imgWidth) / 2, (height - imgHeight) / 2, imgWidth, imgHeight);
                pdf.save('converted.pdf');
            };
        };

        reader.readAsDataURL(file);
    });
</script>
</body>
</html>
