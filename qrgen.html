<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <script>if(localStorage.getItem('dg-invert')==='1')document.documentElement.classList.add('inverted');</script>
</head>
<body>
<div class="ticker" data-pattern="*~*~*~*~*~*~*~*~*~*~"></div>
<nav class="site-nav"><a href="index.html">:: DAWN GABRIEL ::</a></nav>
<a class="back-link" href="index.html">&lt;&lt; BACK</a>

<h1>QR Code Generator</h1>
<p class="subtitle" data-typewriter="FREE. NO ACCOUNT REQUIRED.">FREE. NO ACCOUNT REQUIRED.</p>

<div class="panel">
    <label for="url">URL</label>
    <input type="url" id="url" placeholder="https://example.com" required>

    <label for="size">Size</label>
    <select id="size">
        <option value="128">Small (128x128)</option>
        <option value="256" selected>Medium (256x256)</option>
        <option value="512">Large (512x512)</option>
    </select>

    <button onclick="generateQR()">Generate</button>
    <button id="downloadBtn" style="display:none" onclick="downloadQR()">Download</button>

    <div id="qrcode"></div>
</div>

<div class="ticker" data-pattern="*~*~*~*~*~*~*~*~*~*~"></div>

<script src="script.js"></script>
<script>
    let qr = null;

    function generateQR() {
        const url = document.getElementById('url').value;
        const size = parseInt(document.getElementById('size').value);

        if (!url) {
            alert('Please enter a URL');
            return;
        }

        document.getElementById('qrcode').innerHTML = '';

        qr = new QRCode(document.getElementById('qrcode'), {
            text: url,
            width: size,
            height: size,
            colorDark: '#000000',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });

        document.getElementById('downloadBtn').style.display = 'inline-block';
    }

    function downloadQR() {
        const canvas = document.querySelector('#qrcode canvas');
        if (!canvas) return;

        canvas.toBlob(function(blob) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'qrcode.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    }
</script>
</body>
</html>
